<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Metaetiquetas solicitadas -->
  <title>Suprema 92.5 FM En Vivo - Guanare, Portuguesa</title>
  <meta property="og:title" content="Suprema 92.5 FM En Vivo - Guanare, Portuguesa"/>
  <meta property="og:url" content="https://suprema925fm.com/" />
  <meta property="og:image" content="https://i.imgur.com/sdGLSUU.jpeg" />
  <meta property="og:site_name" content="Suprema 92.5 FM" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; 
      background-color: #000;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .radio-player {
      width: 100%;
      height: 100%;
      /* Imagen de fondo actualizada */
      background: url('https://i.imgur.com/OmLLUao.png') no-repeat center center;
      background-size: cover;
      position: relative;
    }

    /* Capa oscura opcional para mejorar visibilidad de controles */
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.1); 
        pointer-events: none;
    }

    .play-stop {
      position: absolute;
      /* Ajustamos la posición para que no choque con el banner */
      bottom: 120px; 
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      border: none;
      border-radius: 50%;
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      transition: transform 0.2s ease;
    }

    .play-stop:active {
        transform: translateX(-50%) scale(0.95);
    }

    .play-stop svg {
      color: #333;
    }

    /* --- ESTILOS DEL BANNER (RESPONSIVE + FIJO) --- */

    .ad-banner-container {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100px; /* Altura visual del área del banner */
        background-color: rgba(0, 0, 0, 0.85); /* Fondo oscuro */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 50;
        overflow: hidden;
    }

    /* Wrapper que mantiene el tamaño original 728x90 internamente */
    .ad-scaler {
        position: relative;
        width: 728px !important;
        height: 90px !important;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-origin: center center; /* El punto de escala es el centro */
        background-color: transparent;
    }

    /* Forzar estilos sobre el elemento insertado por Revive */
    .ad-scaler ins {
        display: block !important;
        width: 728px !important;
        height: 90px !important;
        margin: 0 auto !important;
        text-decoration: none;
    }

    /* --- MEDIA QUERIES PARA ESCALAR EL BANNER --- */
    
    /* Tablets */
    @media (max-width: 740px) {
        .ad-scaler { transform: scale(0.90); }
    }

    /* Celulares Grandes */
    @media (max-width: 500px) {
        .ad-scaler { transform: scale(0.55); } 
        .play-stop { bottom: 105px; } /* Ajuste fino del botón */
    }

    /* Celulares Estándar (aprox 360px - 400px) */
    @media (max-width: 400px) {
        .ad-scaler { transform: scale(0.48); } 
    }

    /* Celulares Pequeños */
    @media (max-width: 340px) {
        .ad-scaler { transform: scale(0.42); }
    }

  </style>
</head>
<body>
  <div class="radio-player">
    <div class="overlay"></div>

    <button id="playStopButton" class="play-stop">
      <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <svg id="stopIcon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><rect x="6" y="6" width="12" height="12"></rect></svg>
    </button>
    
    <!-- Contenedor del Banner -->
    <div class="ad-banner-container">
        <!-- El ID 'adContainer' será usado por JS para recargar el anuncio -->
        <div id="adContainer" class="ad-scaler">
             <!-- El anuncio se carga aquí vía JavaScript -->
        </div>
    </div>

  </div>
  
  <audio id="radioStream" src="https://radio.cromstudio.com.ve/stream"></audio>

  <script>
    // --- LÓGICA DEL REPRODUCTOR ---
    const playStopButton = document.getElementById('playStopButton');
    const radioStream = document.getElementById('radioStream');
    const playIcon = document.getElementById('playIcon');
    const stopIcon = document.getElementById('stopIcon');

    playStopButton.addEventListener('click', () => {
      if (radioStream.paused) {
        var playPromise = radioStream.play();
        if (playPromise !== undefined) {
            playPromise.then(_ => {
                playIcon.style.display = 'none';
                stopIcon.style.display = 'block';
            }).catch(error => console.log(error));
        }
      } else {
        radioStream.pause();
        playIcon.style.display = 'block';
        stopIcon.style.display = 'none';
      }
    });

    // --- LÓGICA DE PUBLICIDAD (REFRESH CADA 30 SEGUNDOS) ---
    
    function loadBanner() {
        const container = document.getElementById('adContainer');
        
        // 1. Limpiamos el contenedor actual (borra el anuncio viejo)
        container.innerHTML = '';

        // 2. Creamos la etiqueta <ins> dinámicamente
        const insTag = document.createElement('ins');
        insTag.setAttribute('data-revive-zoneid', '2'); // Tu nuevo Zone ID
        insTag.setAttribute('data-revive-id', '3f5b5e135a8d08f01c6c2ca40f88449e');
        
        // 3. Creamos la etiqueta <script> dinámicamente
        const scriptTag = document.createElement('script');
        scriptTag.async = true;
        // Agregamos un timestamp aleatorio para evitar cache agresivo del navegador
        scriptTag.src = '//ads.cromstudio.com.ve/www/delivery/asyncjs.php?t=' + new Date().getTime();

        // 4. Inyectamos ambos en el contenedor
        container.appendChild(insTag);
        container.appendChild(scriptTag);
        
        console.log("Banner actualizado: " + new Date().toLocaleTimeString());
    }

    // Cargar el banner apenas inicie la página
    loadBanner();

    // Configurar el intervalo de 30 segundos (30000 milisegundos)
    // Esto NO recarga la página, solo ejecuta la función loadBanner
    setInterval(loadBanner, 30000);

  </script>
</body>
</html>
