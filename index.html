<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Suprema 92.5 FM En Vivo - Guanare, Portuguesa</title>
  <meta property="og:title" content="Suprema 92.5 FM En Vivo - Guanare, Portuguesa"/>
  <meta property="og:url" content="https://suprema925fm.com/" />
  <meta property="og:image" content="https://i.imgur.com/sdGLSUU.jpeg" />
  <meta property="og:site_name" content="Suprema 92.5 FM" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; 
      background-color: #000;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .radio-player {
      width: 100%;
      height: 100%;
      background: url('https://i.imgur.com/OmLLUao.png') no-repeat center center;
      background-size: cover;
      position: relative;
    }

    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.1); 
        pointer-events: none;
    }

    .play-stop {
      position: absolute;
      bottom: 120px; 
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      border: none;
      border-radius: 50%;
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      transition: transform 0.2s ease;
    }

    .play-stop:active {
        transform: translateX(-50%) scale(0.95);
    }

    .play-stop svg {
      color: #333;
    }

    /* --- ESTILOS DEL BANNER (Usando iFrame) --- */

    .ad-banner-container {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100px;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 50;
        overflow: hidden;
    }

    /* El Scaler asegura que el iFrame de 728px quepa en pantallas pequeñas */
    .ad-scaler {
        position: relative;
        width: 728px !important;
        height: 90px !important;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-origin: center center;
        background-color: transparent;
    }

    /* Estilos para el iFrame */
    .ad-scaler iframe {
        border: 0;
        overflow: hidden;
        width: 728px;
        height: 90px;
    }

    /* --- RESPONSIVIDAD (Escala Agresiva) --- */
    
    @media (max-width: 740px) {
        .ad-scaler { transform: scale(0.90); }
    }

    @media (max-width: 500px) {
        .ad-scaler { transform: scale(0.55); } 
        .play-stop { bottom: 105px; } 
    }

    @media (max-width: 400px) {
        .ad-scaler { transform: scale(0.48); } 
    }

    @media (max-width: 340px) {
        .ad-scaler { transform: scale(0.42); }
    }

  </style>
</head>
<body>
  <div class="radio-player">
    <div class="overlay"></div>

    <button id="playStopButton" class="play-stop">
      <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <svg id="stopIcon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><rect x="6" y="6" width="12" height="12"></rect></svg>
    </button>
    
    <!-- Contenedor del Banner -->
    <div class="ad-banner-container">
        <div class="ad-scaler">
            <!-- El iFrame se genera inicialmente vacío, JS le pondrá la URL correcta -->
            <iframe id="reviveAdFrame" src="" frameborder="0" scrolling="no" width="728" height="90" allowtransparency="true" allow="autoplay"></iframe>
        </div>
    </div>

  </div>
  
  <audio id="radioStream" src="https://radio.cromstudio.com.ve/stream"></audio>

  <script>
    // --- LÓGICA DEL REPRODUCTOR ---
    const playStopButton = document.getElementById('playStopButton');
    const radioStream = document.getElementById('radioStream');
    const playIcon = document.getElementById('playIcon');
    const stopIcon = document.getElementById('stopIcon');

    playStopButton.addEventListener('click', () => {
      if (radioStream.paused) {
        var playPromise = radioStream.play();
        if (playPromise !== undefined) {
            playPromise.then(_ => {
                playIcon.style.display = 'none';
                stopIcon.style.display = 'block';
            }).catch(error => console.log(error));
        }
      } else {
        radioStream.pause();
        playIcon.style.display = 'block';
        stopIcon.style.display = 'none';
      }
    });

    // --- LÓGICA DE PUBLICIDAD IFRAME (REFRESH CADA 30s) ---
    
    function refreshIframe() {
        const iframe = document.getElementById('reviveAdFrame');
        if (!iframe) return;

        // Generamos un número aleatorio real para evitar el caché
        const randomNum = Math.floor(Math.random() * 99999999999);
        
        // Construimos la URL. 
        // Nota: Mantenemos refresh=30 para el servidor, pero el 'cb' (cache buster)
        // cambiará cada vez que JS ejecute esta función, forzando un anuncio nuevo.
        const adUrl = `https://ads.cromstudio.com.ve/www/delivery/afr.php?refresh=30&zoneid=2&cb=${randomNum}`;
        
        // Actualizamos el src del iframe
        iframe.src = adUrl;
        
        console.log("Anuncio refrescado: " + new Date().toLocaleTimeString());
    }

    // 1. Cargar el anuncio inmediatamente al abrir la página
    refreshIframe();

    // 2. Programar el refresco cada 30 segundos
    // Esto es más seguro que el meta-refresh interno porque depende del navegador del usuario
    setInterval(refreshIframe, 30000);

  </script>
</body>
</html>
